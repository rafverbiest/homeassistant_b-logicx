# B-Logicx addresses (full replace on import)
# Types: rlm | softm | aud | shutter | sfeer | readonly | rtc | ldm | tsm
# Fictional example values only — replace with your bus map.
#
# Example conventions: lights/outlets group 2, covers group 3,
# audio group 4, software members group 10.

addresses:
  - type: rlm
    name: Kitchen Light
    group: 2
    address: 33
    on_command: Set
    off_command: Reset
    check_status: true

  - type: shutter
    name: Office Blind
    open_group: 3
    open_address: 20
    close_group: 3
    close_address: 21
    open_time: 30
    close_time: 30
    check_status: true

  - type: sfeer
    name: Lounge
    group: 5
    check_status: true
    moods:
      - name: Reading
        address: 221
      - name: Cinema
        address: 222

  - type: readonly
    name: Example read-only input
    group: 1
    address: 30
    check_status: false

  - type: rtc
    name: Bus clock
    group: 1
    address: 1
    sync_interval_hours: 12
    sync_minute: 17
    sync_on_startup: true
    sync_on_dst: true
    dst_delay_minutes: 1

  - type: ldm
    name: Porch light sensor
    group: 1
    address: 23
    check_status: true

  - type: tsm
    name: Living thermostat
    group: 1
    address: 45
    check_status: true

  - type: aud
    name: Living audio
    group: 4
    address: 1
    source_1: Radio
    source_2: CD
    source_3: Bluetooth
    source_4: HDMI
    source_5: Optical
    source_6: USB
    source_7: AirPlay
    source_8: Aux

  # SoftM without virtual status tracking (BL-STA answers Toggle/Status).
  - type: softm
    name: Software Member Example
    group: 10
    address: 201
    on_command: Toggle
    off_command: Reset
    enable_softm_status_tracking: false
    check_status: true

  # SoftM with virtual status tracking (HA answers Toggle/Status/Timer).
  # Must have Set/Reset as on/off commmand; wall Toggle is answered by SoftM tracking.
  # Also enable Integration settings → SoftM status tracking.
  - type: softm
    name: Software Member Example
    group: 10
    address: 200
    on_command: Set
    off_command: Reset
    enable_softm_status_tracking: true
    softm_timer: 120
    persist_state: true
    default_state: false
